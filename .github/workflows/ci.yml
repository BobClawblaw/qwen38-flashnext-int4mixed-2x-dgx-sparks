name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SPARK_CLUSTER: none        # the shipped defaults, never a cluster file
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: unit tests (settings guards, engine command line, the suite's checkers)
        run: python3 -m unittest discover -s tests -q
      - name: settings dry runs, every profile
        run: |
          python3 -m spark validate | grep -q "profile=concurrent tp=2 ctx=1048576 yarn=1"
          PROFILE=serial python3 -m spark validate | grep -q "parallel=1"
          YARN=0 CONTEXT=262144 python3 -m spark validate | grep -q "ctx=262144 yarn=0"
      - name: refusals
        run: |
          for bad in "YARN=0 CONTEXT=524288" "CONTEXT=262144" "PROFILE=long" "EXTRA_ARGS=--tp\ 1" "MAX_TOKENS=0100" "KV_DTYPE=fp8" "PATCH_SHA256=$(printf 'b%.0s' {1..64})"; do
            if env $bad python3 -m spark validate; then echo "accepted $bad" >&2; exit 1; fi
          done
      - name: the patches apply to TensorFold at their pinned commits
        run: |
          git clone --quiet --filter=blob:none https://github.com/ashhart/TensorFold.git tf
          e() { python3 -c "import tomllib; print(tomllib.load(open('recipe.toml','rb'))['engine']['$1'])"; }
          git -C tf checkout --quiet "$(e tensorfold_sha)"
          git -C tf apply --check "../docker/patches/$(e patch)"
          git -C tf checkout --quiet "$(e native_tensorfold_sha)"
          git -C tf apply --check "../docker/patches/$(e native_patch)"
      - name: byte and compile checks
        run: |
          python3 -m py_compile spark/*.py quality/*.py bench/*.py
          ! grep -rIn --exclude-dir=.git --exclude-dir=evidence -E "/home/[a-z]+/" . || { echo "a local home path in the tree" >&2; exit 1; }
