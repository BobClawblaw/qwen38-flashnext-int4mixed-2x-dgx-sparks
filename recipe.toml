# The recipe's defaults. `cluster.toml` next to this file overrides them per cluster (copy cluster.example.toml),
# an environment variable of the same name in upper case overrides both (PORT=8001 python3 -m spark up).

[model]
repo = "Minachist/Qwen3.8-Flash-Next-INT4-Mixed-AutoRound"
revision = "f6f90ddc39e9d212aa5b96f43999183deb4ce192"
served_name = "Qwen3.8-Flash-Next-INT4-Mixed"
# the folder the engine serves: the snapshot converted by spark/convert_mixed.py, under tf_cache. `up` downloads it
# ready-made from converted_repo at converted_revision when both are set (the bytes the converter produces, published
# with its hash in the model card); with converted_repo empty it converts the snapshot locally (about 25 GPU minutes).
converted = "affine-experts-v2"
converted_repo = "BobClawblaw/Qwen3.8-Flash-Next-INT4-Mixed-TensorFold"
converted_revision = "00a844f4a5453ec8f34e75bce7d43a004731ebfa"

[engine]
# TensorFold's native (Zig) release with this recipe's patch, built by docker/Dockerfile.native: our Flash Next port
# for two CUDA ranks. Up to 16 streams, images and video (data and HTTPS URLs), sampling, structured output, kept
# prompt states, kv_dtype int8 or int4.
tensorfold_repo = "https://github.com/ashhart/TensorFold.git"
tensorfold_sha = "d4fc1964d0637c33e09ddac18aec936f962bb646"     # v1.0.4
patch = "tensorfold-native-v1.0.4.patch"
# sha256 of docker/patches/<patch>; the image carries it as a label and `up` refuses a mismatch
patch_sha256 = "ce40418ae58ec402b9598ab2ae415003b4d8995c204121dea5eb3376b4cc423e"
image = "tf-qwen38-int4mixed:native-v1.0.4"
base_image = "nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c"
container = "tf-qwen38-int4mixed"

[cluster]
head_ip = "10.100.8.1"           # the head's address on the RoCE link (rank 1 rendezvous)
worker = "user@10.100.8.2"       # ssh login of the worker; rank 1 runs there
iface = "enp1s0f1np1"            # NCCL_SOCKET_IFNAME
hca = "rocep1s0f1"               # NCCL_IB_HCA (pin one; GB10 exposes dead HCAs too)
master_port = 29561
port = 8000
hf_cache = "~/.cache/huggingface"
tf_cache = "~/.cache/tensorfold-qwen38-int4mixed"
# the folder under tf_cache that holds the converted checkpoint and the profile folders (named after the commit the
# first conversion ran under; kept so existing caches stay valid)
cache_folder = "ed78d6fc204d89d90b045bf033d6551e7714f3a1"

[serve]
profile = "concurrent"           # concurrent (16 streams, the default) | serial (one stream)
# the window: 1,048,576 tokens through static YaRN x4 over the trained 262,144 (yarn = true), or yarn = false and
# context up to 262,144 for the plain rotary (short prompts see the scaled rotary too when yarn is on)
yarn = true
context = 1048576
kv_dtype = "int8"                # int8 | int4 (30% less cache a position, 0-10% slower at 16 streams)
drafts = true                    # MTP and copy drafts (outputs equal undrafted); false serves without them
parallel = 1
thinking = false
max_tokens = 32768
vision = true
vision_urls = true             # public HTTPS image and video URLs, fetched by rank 0 (data URLs always work)
vision_max_images = 0            # 0: the engine's default (4)
tool_system = "Tool calls: include only the arguments the user explicitly provided or clearly implied. Never fill in optional arguments with default or guessed values. When a request asks for several things, make one call for each of them."
memory_reserve_gib = 0           # 0: the engine's default
extra_args = ""
extra_env = ""
settle_seconds = 30              # wait after a stop before a rank starts (NCCL's first ibv_reg_mr on the worker)
memguard = true
memguard_min_avail_mb = 3072
memguard_min_swap_free_mb = 2048

[profiles.concurrent]
parallel = 16

[profiles.serial]
parallel = 1

[yarn]
factor = 4
trained_context = 262144
